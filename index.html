<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Internet Explorer Compatibility -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helpdesk System</title>

  <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-database-compat.js"></script>
  <script src="app.js"></script>

  <!-- Font Awesome for icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
  <!-- Your existing stylesheet -->
  <link rel="stylesheet" href="css/style.css">
  <!-- Polyfills -->
  <script src="https://unpkg.com/whatwg-fetch@3.6.2/dist/fetch.umd.js"></script>
  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyBaSuFhNUeghfXEznYCHxYnagkjiojfO_M",
      authDomain: "helpdeskrpharmacy.firebaseapp.com",
      databaseURL: "https://helpdeskrpharmacy-default-rtdb.firebaseio.com",
      projectId: "helpdeskrpharmacy",
      messagingSenderId: "776189919696",
      appId: "1:776189919696:web:ab3be5e265dbfff8faf9d5",
      measurementId: "G-TL0ZQ9L17Q"
    };
    
    // Initialize Firebase only if not already initialized
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig); // Initialize Firebase if not already done
    } else {
      firebase.app(); // If already initialized, use that one
    }
  </script>

</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="oracle-image-container">
        <img src="Images/oracle-svgrepo-com.svg" alt="Oracle Logo" class="oracle-image">
      </div>
      <h2 class="help-text">How can we help you today?</h2>
      <div class="search-wrapper">
        <i class="fas fa-search search-icon" aria-hidden="true"></i>
        <input
          type="text"
          id="searchInput"
          placeholder="Search..."
          class="form-input"
          onkeyup="searchContent()"
        />
      </div>  
      <!-- PROFILE ICON triggers login/profile modal -->
      <i id="profile-icon" class="fas fa-user-circle"></i>
    </div>
  </header>

  <div id="no-results" class="no-results" hidden>
    No matching topics found.
  </div>

  <main class="main-content">
    <!-- everything here is now built dynamically -->
    <div id="dynamic-accordion"></div>
  </main>
  
<!-- ========================= -->
<!-- LOGIN / PROFILE MODAL    -->
<!-- ========================= -->
<div id="login-modal" class="modal" hidden>
  <div class="modal-content">
    <button class="modal-close" aria-label="Close">&times;</button>
    <h2 class="modal-title">Login</h2>

    <!-- for auth errors -->
    <div id="login-error" style="color: #c00; text-align:center; margin: 12px 0;"></div>

    <input type="email"    id="login-email"    placeholder="Email"    class="form-input" />
    <input type="password" id="login-password" placeholder="Password" class="form-input" />

    <!-- LOGIN → visible by default -->
    <button id="login-btn" class="login-btn">Login</button>
    <!-- LOGOUT → hidden until Firebase says you're logged in -->
    <button id="logout-btn" class="login-btn" hidden>Logout</button>
    <!-- CHANGE PASSWORD → hidden until you're logged in -->
    <button id="change-password-btn" class="login-btn" hidden>Change Password</button>
  </div>
</div>
  <!-- ========================= -->
  <!-- ADD FILE & ARCHIVED MODALS -->
  <!-- ========================= -->
  <div id="file-upload-modal" class="modal" hidden>
    <div class="modal-content">
      <button class="modal-close" aria-label="Close">&times;</button>
      <div id="file-upload-form">
        <div class="file-upload-inner">
          <div class="custom-file-upload">
            <label for="fileInput" class="choose-file-btn">Choose File</label>
            <span id="selected-file-name" class="file-name">No file chosen</span>
          </div>
          <input type="file" id="fileInput" accept="application/pdf" hidden />
  
          <!-- Title -->
          <input
            type="text"
            id="fileTitle"
            placeholder="File Title"
            class="form-input small-input"
          />
          <!-- Pick an existing category -->
          <select id="module-dropdown" class="form-select small-select">
            <optgroup label="Working Instructions">
              <optgroup label="Receivables">
                <option value="Receivables_Maintenance">Maintenance</option>
                <option value="Receivables_Operational_Procedure">Operational Procedure</option>
              </optgroup>
              <optgroup label="Payables">
                <option value="Payables_Maintenance">Maintenance</option>
                <option value="Payables_Operational_Procedure">Operational Procedure</option>
              </optgroup>
              <optgroup label="Purchasing">
                <option value="Purchasing_Maintenance">Maintenance</option>
                <option value="Purchasing_Operational_Procedure">Operational Procedure</option>
              </optgroup>
              <optgroup label="Fixed Asset">
                <option value="Fixed_Asset_Maintenance">Maintenance</option>
                <option value="Fixed_Asset_Operational_Procedure">Operational Procedure</option>
              </optgroup>
              <optgroup label="Cash Management">
                <option value="Cash_Management_Operational_Procedure">Operational Procedure</option>
              </optgroup>
              <optgroup label="Inventory">
                <option value="Inventory_Maintenance">Maintenance</option>
                <option value="Inventory_Operational_Procedure">Operational Procedure</option>
              </optgroup>
              <optgroup label="HRMS Global">
                <option value="HRMS_Global_Maintenance">Maintenance</option>
              </optgroup>
              <optgroup label="General Ledger">
                <option value="General_Ledger_Maintenance">Maintenance</option>
                <option value="General_Ledger_Operational_Procedure">Operational Procedure</option>
              </optgroup>
              <option value="Oracle_Guides">Oracle Guides</option>
            </optgroup>
              <optgroup label="Standard Operating Procedures">
                <optgroup label="Finance">
                  <option value="AR">AR</option>
                  <option value="AP">AP</option>
                  <option value="Sales_Audit">Sales Audit</option>
                  <option value="General_Ledger_SOP">General Ledger</option>
                  <option value="Inventory_Control">Inventory Control</option>
                  <option value="Tax">Tax</option>
                </optgroup>
                <optgroup label="Treasury">
                  <option value="Check-run">Check-run</option>
                  <option value="Bank_Control">Bank Control</option>
                  <option value="Cash_Flow">Cash Flow</option>
                </optgroup>
                <optgroup label="HR">
                  <option value="Payroll">Payroll</option>
                  <option value="Timekeeping">Timekeeping</option>
                </optgroup>
                <optgroup label="IT">
                  <option value="Application">Application</option>
                  <option value="Infra">Infra</option>
                </optgroup>
              </optgroup>
              <optgroup label="Functional Design Document">
                <option value="FDD_Receivables">Receivables</option>
                <option value="FDD_Payables">Payables</option>
                <option value="FDD_Cash_Management">Cash Management</option>
                <option value="FDD_General_Ledger">General Ledger</option>
                <option value="FDD_Related_Document">Related Document</option>
              </optgroup>
              <optgroup label="Process Flow">
                <option value="PF_Finance">Finance</option>
                <option value="PF_Treasury">Treasury</option>
                <option value="PF_HR">HR</option>
                <option value="PF_IT">IT</option>
              </optgroup>
              <optgroup label="System Flow">
                <option value="SF_Receivables">Receivables</option>
                <option value="SF_Payables">Payables</option>
                <option value="SF_Purchasing">Purchasing</option>
                <option value="SF_Fixed_Asset">Fixed Asset</option>
                <option value="SF_Cash_Management">Cash Management</option>
                <option value="SF_General_Ledger">General Ledger</option>
              </optgroup>
              <optgroup label="Templates">
                <option value="tl_templates">Templates</option>
              </optgroup>
          </select>
          <button id="uploadBtn"          class="upload-btn">Upload</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Archived Files Modal -->
  <div id="archived-modal" class="modal" hidden>
    <div class="modal-content">
      <button class="modal-close" aria-label="Close">&times;</button>
      <h2>Archived Files</h2>
      <ul id="archived-files-list" class="pdf-list"></ul>
    </div>
  </div>

  <!-- ROLE-BASED ACTION BUTTONS -->
<div id="left-buttons">
  <!-- hidden by default, JS will show as appropriate -->
  <button id="view-archived-btn" class="view-archived-btn" style="display:none">
    <i class="fas fa-archive"></i> Archived Files
  </button>
  <button id="add-file-btn" class="add-file-btn" style="display:none">
    <i class="fas fa-plus"></i> Add
  </button>
  <button id="admin-login-btn" class="admin-login-btn" style="display:none">
    <i class="fas fa-user-shield"></i> Admin
  </button>
</div>


</body>
</html>
